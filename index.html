<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>画面共有</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  background: #f2f5f8;
  color: #222;
}

header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;

  padding: 18px;

  font-size: 17px;
  font-weight: bold;

  color: white;
  background: #2563eb;

  margin-top: 12px;
}

button:active {
  transform: scale(.98);
}

.hidden {
  display: none;
}

.code {
  font-size: 42px;
  font-weight: bold;

  text-align: center;

  letter-spacing: 8px;

  background: #edf3ff;

  border-radius: 15px;

  padding: 25px;

  margin: 20px 0;
}

input {
  width: 100%;

  padding: 17px;

  border: 2px solid #ddd;

  border-radius: 14px;

  font-size: 24px;

  text-align: center;

  letter-spacing: 5px;
}

.status {
  text-align: center;

  background: #f1f5f9;

  border-radius: 12px;

  padding: 13px;

  margin: 15px 0;
}

.back {
  background: #64748b;
}

</style>
</head>


<body>

<header>
  <h1>📱 画面共有</h1>
</header>


<main>

<!-- 最初の画面 -->

<section id="home" class="card">

  <h2>画面共有を開始</h2>

  <p>
    どちらを使用しますか？
  </p>

  <button onclick="showShare()">
    📱 自分の画面を共有する
  </button>

  <button onclick="showView()">
    👀 他の人の画面を見る
  </button>

</section>


<!-- 共有する側 -->

<section id="share" class="card hidden">

  <h2>📱 自分の画面を共有</h2>

  <p>
    下のコードを、見る人に伝えてください。
  </p>

  <div id="code" class="code">
    000000
  </div>

  <div class="status">
    このコードで接続できます
  </div>

  <button onclick="startShare()">
    ▶ 画面共有を開始
  </button>

  <button
    class="back"
    onclick="location.reload()">
    ← 戻る
  </button>

</section>


<!-- 見る側 -->

<section id="view" class="card hidden">

  <h2>👀 他の人の画面を見る</h2>

  <p>
    相手から教えてもらった
    6桁コードを入力してください。
  </p>

  <input
    id="roomCode"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="000000">

  <button onclick="connect()">
    ▶ 接続する
  </button>

  <div id="viewStatus" class="status">
    コードを入力してください
  </div>

  <button
    class="back"
    onclick="location.reload()">
    ← 戻る
  </button>

</section>

</main>


<script>

function showShare() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("share")
    .classList.remove("hidden");

  generateCode();
}


function showView() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("view")
    .classList.remove("hidden");

}


function generateCode() {

  const code =
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  document
    .getElementById("code")
    .textContent = code;

}


async function startShare() {

  try {

    const stream =
      await navigator
        .mediaDevices
        .getDisplayMedia({
          video: true,
          audio: true
        });

    alert(
      "画面共有が開始されました！"
    );

  } catch (error) {

    alert(
      "画面共有がキャンセルされました。"
    );

  }

}


function connect() {

  const code =
    document
      .getElementById("roomCode")
      .value;

  if (
    code.length !== 6
  ) {

    document
      .getElementById("viewStatus")
      .textContent =
      "6桁のコードを入力してください。";

    return;

  }

  document
    .getElementById("viewStatus")
    .textContent =
    "接続準備中…";

}

</script>

</body>
</html>
