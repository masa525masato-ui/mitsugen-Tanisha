<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みつばち蜜源マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<style>
:root{--honey:#F2B01E;--honey-d:#B77F00;--leaf:#2F5D3A;--leaf-d:#1F4129;--mint:#E7F0D8;--cream:#FFFCF0;--ink:#1D2A21;--mut:#5E6F63;--line:#D9E2CB;--ring:#2F5D3A;--danger:#B3372B}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--cream);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* header */
header{flex:none;display:flex;align-items:center;gap:.4rem;background:var(--leaf);color:#fff;padding:env(safe-area-inset-top) .5rem 0;height:calc(3.5rem + env(safe-area-inset-top));position:relative;z-index:20}
header h1{flex:1;margin:0;font-size:1.1rem;display:flex;align-items:center;gap:.5rem;letter-spacing:.02em}
.ib{width:2.9rem;height:2.9rem;border:0;border-radius:.8rem;background:transparent;color:#fff;display:grid;place-items:center;position:relative}
.ib:active{background:rgba(255,255,255,.18)}
.ib svg{width:1.6rem;height:1.6rem}
#badge{position:absolute;top:.25rem;right:.2rem;min-width:1.15rem;height:1.15rem;border-radius:.6rem;background:var(--honey);color:var(--leaf-d);font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 .25rem}
/* map */
#maint{flex:none;background:#FFF1C7;color:#5C4200;border-bottom:2px solid #F2D48A;padding:.35rem .8rem;font-size:.78rem;line-height:1.5;display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:center;position:relative;z-index:15}
#maint b{white-space:nowrap}
#mapwrap{flex:1;position:relative;min-height:20rem}
#map{position:absolute;inset:0;isolation:isolate;background:#dfe8d2}
.leaflet-top.leaflet-right{margin-top:.2rem}
.ring{stroke:var(--ring)}
#map.sat{--ring:#FFE680}
.ringlab{pointer-events:none}
.ringlab span{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--leaf-d);border:1.5px solid var(--leaf);border-radius:1rem;padding:.05rem .5rem;font-size:.78rem;font-weight:700;white-space:nowrap}
.school{pointer-events:none}
.school span{position:absolute;transform:translate(-50%,-50%);width:2.1rem;height:2.1rem;border-radius:50%;background:var(--leaf);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:700;font-size:.95rem;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.handle span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--honey);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .1s}
.handle.st span{background:#2F8A4A}
.handle.en span{background:#C8402F}
.handle.bd span{background:var(--honey)}
.handle.mv span{background:#fff;border-color:var(--leaf)}
.handle.mv svg{width:18px;height:18px}
.handle.sel span{box-shadow:0 0 0 4px #1D2A21,0 2px 6px rgba(0,0,0,.4);transform:scale(1.15)}
.pin svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tmplab{background:var(--honey);border:2px solid #fff;color:var(--leaf-d);font-weight:700;padding:0 .35rem;border-radius:.6rem;box-shadow:none}
.tmplab:before{display:none}
/* hint + fab */
#hint{position:absolute;z-index:30;top:4rem;left:50%;transform:translateX(-50%);background:var(--leaf-d);color:#fff;border-radius:2rem;padding:.35rem .5rem .35rem 1rem;display:flex;align-items:center;gap:.3rem;font-size:.9rem;box-shadow:0 3px 10px rgba(0,0,0,.25);max-width:calc(100% - 5rem);white-space:nowrap}
#hint button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:1.7rem;height:1.7rem;font-size:1rem;line-height:1}
.mb{border:0;background:transparent;padding:.55rem .95rem;min-height:2.75rem;font-weight:700;color:var(--leaf);display:flex;align-items:center;gap:.4rem;border-radius:.75rem}
#fcnt{background:var(--honey);color:var(--leaf-d);border-radius:1rem;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;font-size:.78rem;font-style:normal;padding:0 .3rem}
#fwrap{position:absolute;z-index:30;top:.6rem;left:.8rem}
.loc{width:3.1rem;height:3.1rem;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25);display:grid;place-items:center}
.loc svg{width:1.6rem;height:1.6rem}
.loc[aria-pressed=true]{background:#2a7de1}
.loc[aria-pressed=true] svg{stroke:#fff}
.frow{display:flex;align-items:center;gap:.8rem;padding:.75rem .4rem;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer}
.frow input{width:1.4rem;height:1.4rem;accent-color:var(--leaf);flex:none}
.frow i{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{color:var(--mut);font-weight:400}
#fab{position:absolute;z-index:30;right:.8rem;bottom:.9rem;display:flex;flex-direction:column;align-items:flex-end;gap:.55rem}
.panel{background:#fff;border-radius:1rem;box-shadow:0 3px 12px rgba(0,0,0,.25);padding:.3rem;display:flex;gap:.25rem}
.seg button{border:0;background:transparent;border-radius:.75rem;padding:.55rem .9rem;min-height:2.75rem;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--leaf);color:#fff}
#mode button[data-m=edit][aria-pressed=true]{background:var(--honey);color:var(--leaf-d)}
/* nav */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:20}
nav button{border:0;background:transparent;padding:.45rem 0 .4rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.74rem;color:var(--mut);min-height:3.6rem}
nav button .ic{font-size:1.35rem;line-height:1.4rem}
nav button.on{color:var(--leaf);font-weight:700}
nav button.on .ic{background:var(--mint);border-radius:1rem;padding:0 .9rem}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(20,35,25,.45);z-index:1500;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(19rem,82vw);background:var(--cream);z-index:1600;transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{transform:none}
#drawer .dh{background:var(--leaf);color:#fff;padding:calc(1.2rem + env(safe-area-inset-top)) 1.2rem 1.2rem}
#drawer .dh b{display:block;font-size:1.2rem;margin-top:.5rem}
#drawer .dh small{opacity:.85}
#drawer ul{list-style:none;margin:.5rem 0;padding:0 .6rem;overflow-y:auto}
#drawer li.sep{border-top:1px solid var(--line);margin:.4rem .8rem}
#drawer li button{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:.9rem;padding:.9rem .8rem;border-radius:.9rem;font-size:1.05rem}
#drawer li button:active{background:var(--mint)}
/* popover */
.ov{position:fixed;inset:0;background:rgba(20,35,25,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:2000}
.pop{background:var(--cream);border-radius:1.2rem;width:min(34rem,100%);max-height:min(88dvh,100%);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s ease-out}
.pop.big{width:min(40rem,100%);height:min(88dvh,100%)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.ov.side{background:transparent;pointer-events:none;justify-content:flex-end;align-items:stretch;padding:0}
.ov.side .pop{pointer-events:auto;width:min(24rem,92vw);height:100%;max-height:100%;border-radius:1.2rem 0 0 1.2rem;animation:slidein .22s ease-out;box-shadow:-6px 0 24px rgba(0,0,0,.3)}
@keyframes slidein{from{transform:translateX(100%)}}
@media (max-width:600px){.ov.side{align-items:flex-end;justify-content:center}.ov.side .pop{width:100%;height:auto;max-height:58dvh;border-radius:1.2rem 1.2rem 0 0;animation:pop .18s ease-out}}
.pop-h{display:flex;align-items:center;gap:.5rem;padding:.8rem .8rem .7rem 1.2rem;background:var(--mint);border-bottom:1px solid var(--line)}
.pop-h h2{flex:1;margin:0;font-size:1.15rem;color:var(--leaf-d)}
.x{border:0;background:#fff;border-radius:50%;width:2.4rem;height:2.4rem;font-size:1.4rem;line-height:1;color:var(--leaf-d)}
.pop-b{padding:1rem 1.2rem 1.3rem;overflow:auto;-webkit-overflow-scrolling:touch}
/* forms */
.f{display:block;margin-bottom:1rem;font-weight:700;font-size:.92rem;color:var(--leaf-d)}
.f input[type=text],.f input[type=search],.f textarea,.f select{display:block;width:100%;margin-top:.35rem;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:.8rem;background:#fff;font-weight:400;font-size:1rem}
.f input:disabled,.f textarea:disabled{background:#F1F3EA;color:var(--ink);opacity:1}
.f input[type=color]{display:block;margin-top:.35rem;width:100%;height:3rem;border:1.5px solid var(--line);border-radius:.8rem;background:#fff;padding:.2rem}
.thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.th{position:relative;width:4.6rem;height:4.6rem}
.th>button:first-child{width:100%;height:100%;border:0;padding:0;border-radius:.7rem;overflow:hidden;background:var(--mint)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .rm{position:absolute;top:-.4rem;right:-.4rem;width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid #fff;background:var(--danger);color:#fff;line-height:1}
.btns{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.sp{flex:1}
.primary,.ghost{border-radius:.9rem;padding:.7rem 1.2rem;min-height:2.9rem;font-weight:700;border:2px solid var(--leaf)}
.primary{background:var(--leaf);color:#fff}
.ghost{background:#fff;color:var(--leaf)}
.ghost.danger{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
.err{color:var(--danger);font-size:.88rem;margin:-.5rem 0 .8rem}
/* コンパクト表示(植物一覧・表示する植物) */
.pop.compact{width:max(68vw,min(32rem,100%));max-width:100%;height:84dvh}
@media (max-width:700px){.pop.compact{width:100%;height:88dvh}}
.compact .pop-h{padding:.4rem .5rem .4rem 1rem}
.compact .pop-h h2{font-size:1rem}
.compact .x{width:2.1rem;height:2.1rem;font-size:1.25rem}
.compact .pop-b{padding:.6rem .8rem .8rem}
.compact .filters{grid-template-columns:repeat(3,1fr);gap:.35rem;margin-bottom:.5rem}
.compact .filters .f{font-size:.72rem}
.compact .filters .f select,.compact .filters .f input[type=search]{margin-top:.15rem;padding:.4rem .5rem;font-size:.88rem;border-radius:.6rem}
.compact .filters .chk{grid-column:auto;font-size:.8rem;align-self:end;min-height:2.2rem}
.compact .filters .chk input{width:1.1rem;height:1.1rem}
.compact .cnt{margin:.1rem 0 .35rem;font-size:.78rem}
.compact .btns{margin:0 0 .4rem!important;gap:.4rem}
.compact .btns .ghost{padding:.35rem .6rem;min-height:2.2rem;font-size:.82rem;flex:1;border-width:1.5px}
.compact .card{padding:.3rem .5rem;margin-bottom:.3rem;border-radius:.75rem;gap:.6rem}
.compact .card .im{width:2.5rem;height:2.5rem;border-radius:.6rem}
.compact .card .im i{width:1.1rem;height:1.1rem;border-width:2px}
.compact .card b{font-size:.92rem}
.compact .card small{font-size:.74rem}
.compact .frow{padding:.4rem .3rem;gap:.6rem;font-size:.92rem}
.compact .frow input{width:1.2rem;height:1.2rem}
.compact .frow i{width:.95rem;height:.95rem}
.compact .empty{padding:1.2rem .5rem}
.toprow{display:flex;align-items:flex-end;gap:.6rem;margin-bottom:.5rem}
.toprow .f{flex:1;min-width:0;margin:0;font-size:.72rem}
.toprow .f input[type=search]{margin-top:.15rem;padding:.4rem .5rem;font-size:.88rem;border-radius:.6rem}
.toprow #tabs{flex:none;margin:0}
.compact #tabs{display:inline-flex;width:auto;padding:.15rem;border-radius:.8rem}
.compact #tabs button{padding:.25rem .8rem;min-height:2rem;font-size:.8rem;border-radius:.6rem;white-space:nowrap;flex:none;word-break:keep-all}
.compact #tabs button span{white-space:nowrap}
.card .go,.compact .btns .ghost{white-space:nowrap;word-break:keep-all}
.card .tx small{word-break:keep-all}
/* アコーディオン */
.acc{border:1.5px solid var(--line);border-radius:.8rem;margin-bottom:.4rem;background:#fff;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:.6rem;padding:.2rem .6rem}
.nm-cb{width:1.3rem;height:1.3rem;accent-color:var(--leaf);flex:none}
.acc-t{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;border:0;background:transparent;padding:.45rem 0;font-weight:700;text-align:left;font-size:.95rem}
.acc-t i{width:1rem;height:1rem;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.acc-t .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-t small{color:var(--mut);font-weight:400;font-size:.76rem;white-space:nowrap}
.chev{color:var(--mut);transition:transform .15s}
.acc.open>.acc-h .chev{transform:rotate(90deg)}
.acc-b{display:none;border-top:1px solid var(--line);background:#FBFCF5;padding:.15rem .7rem .4rem}
.acc.open>.acc-b{display:block}
.irow{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}
.irow:last-child{border:0}
.irow label{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;font-size:.86rem}
.irow input{width:1.2rem;height:1.2rem;accent-color:var(--leaf);flex:none}
.irow .ty{background:var(--mint);border-radius:1rem;padding:0 .5rem;font-size:.72rem;font-weight:700;color:var(--leaf-d);flex:none}
.irow small{color:var(--mut)}
.irow.dim{opacity:.55}
.irow .go{padding:.15rem .7rem;min-height:2rem;font-size:.8rem;border-width:1.5px}
.bl{display:flex;gap:.5rem;align-items:center;margin-top:.35rem}
.bl select{margin-top:0!important}
.mini{padding:.3rem .4rem;border:1.5px solid var(--line);border-radius:.6rem;background:#fff;font-size:.88rem}
.card .go{padding:.25rem .7rem;min-height:2.2rem;font-size:.82rem;flex:none;border-width:1.5px}
.cl{position:relative}
.cl .cnt{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:var(--leaf-d);color:#fff;border:2px solid #fff;font:700 12px/18px sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.avatar{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--mint);display:grid;place-items:center;flex:none}
.soon-note{background:#FFF4D1;border:1.5px solid #F2D48A;border-radius:.8rem;padding:.7rem .8rem;line-height:1.7;font-size:.9rem}
.set .btns .ghost,.set .btns .primary,.soon-note+.btns .ghost,.soon-note+.btns .primary{white-space:nowrap}
.seg.full.sm,.seg.sm{display:inline-flex;width:auto;padding:.15rem;border-radius:.8rem}
.seg.full.sm button,.seg.sm button{padding:.25rem .8rem;min-height:2rem;font-size:.8rem;border-radius:.6rem;white-space:nowrap;flex:none}
.ghost.sm,.primary.sm{padding:.25rem .8rem!important;min-height:2.1rem!important;font-size:.8rem!important;white-space:nowrap;border-width:1.5px}
.gbtn{width:100%}
.or{display:flex;align-items:center;gap:.6rem;color:var(--mut);margin:.8rem 0;font-size:.85rem}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.acchead{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.ini{width:100%;height:100%;display:grid;place-items:center;background:var(--honey);color:var(--leaf-d);font-weight:700}
.avatar.sm{width:2.1rem;height:2.1rem;border:2px solid #fff}
/* lists */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem}
.filters .f{margin:0}
.filters .wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--leaf-d);font-size:.92rem}
.chk input{width:1.3rem;height:1.3rem;accent-color:var(--leaf)}
.cnt{color:var(--mut);font-size:.85rem;margin:.2rem 0 .6rem}
.card{width:100%;display:flex;gap:.8rem;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:1rem;padding:.6rem;margin-bottom:.55rem}
.card:active{background:var(--mint)}
.card .im{flex:none;width:3.6rem;height:3.6rem;border-radius:.8rem;background:var(--mint);overflow:hidden;display:grid;place-items:center}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im i{width:1.4rem;height:1.4rem;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.card b{display:block}
.card small{color:var(--mut)}
.card .tx{flex:1;min-width:0}
.card .tx b,.card .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.empty{text-align:center;color:var(--mut);padding:2rem 1rem;line-height:1.7}
.nt{position:relative}
.nt .dot{flex:none;width:.7rem;height:.7rem;border-radius:50%;background:var(--honey)}
.nmain{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex}
.nt .tx small.pv{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:1rem;padding:.05rem .55rem;background:var(--mint);color:var(--leaf-d);margin-right:.35rem}
.chip.add{background:#DDEFD0}.chip.edit{background:#FFF0C2;color:#7A5600}.chip.del{background:#F7DAD5;color:var(--danger)}.chip.upd{background:#D8E8F7;color:#1F4E7A}
.nbody{white-space:pre-wrap;line-height:1.8;font-size:1.05rem;margin:1rem 0}
/* settings */
.set{padding:.2rem 0 1rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.set:last-child{border:0;margin:0}
.set h3{margin:0 0 .6rem;font-size:1rem;color:var(--leaf-d)}
.seg.full{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:1rem;padding:.25rem}
.seg.full button{flex:1}
input[type=range]{width:100%;accent-color:var(--leaf);height:2rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.sw{position:relative;width:3.4rem;height:2rem;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;z-index:2}
.sw i{position:absolute;inset:0;border-radius:2rem;background:#C8CFBD;transition:.2s}
.sw i:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--leaf)}
.sw input:checked+i:after{transform:translateX(1.4rem)}
/* toast */
#toasts{position:fixed;top:calc(3.9rem + env(safe-area-inset-top));right:.8rem;left:auto;z-index:3000;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;pointer-events:none;width:min(22rem,calc(100vw - 1.6rem))}
.toast{pointer-events:auto;background:var(--leaf-d);color:#fff;border-radius:1rem;padding:.7rem 1rem;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:tin .25s ease-out;border-left:6px solid var(--honey);font-size:.92rem;transition:opacity 1.6s linear}
.toast.fade{opacity:0}
.toast b{display:block}
.toast.warn{background:var(--danger);border-color:#fff}
@keyframes tin{from{transform:translateX(1.5rem);opacity:0}}
/* coach */
#coach{position:fixed;inset:0;z-index:5000}
#spot{position:fixed;border-radius:1rem;box-shadow:0 0 0 100vmax rgba(20,35,25,.68);border:3px solid var(--honey);transition:all .25s ease;pointer-events:none}
#bubble{position:fixed;width:min(21rem,calc(100vw - 1.5rem));background:var(--cream);border-radius:1.1rem;padding:1rem 1.1rem;box-shadow:0 8px 28px rgba(0,0,0,.4);line-height:1.7}
#bubble p{margin:0 0 .8rem}
#bubble .btns{margin:0}
#bubble small{color:var(--mut)}
</style>
</head>
<body>
<header>

  <h1><svg width="26" height="26" viewBox="0 0 24 24"><polygon points="12,1 21.5,6.5 21.5,17.5 12,23 2.5,17.5 2.5,6.5" fill="#F2B01E"/><polygon points="12,7 16.5,9.5 16.5,14.5 12,17 7.5,14.5 7.5,9.5" fill="#2F5D3A"/></svg>みつばち蜜源マップ</h1>
  <button class="ib" id="btn-bell" aria-label="お知らせ"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg><span id="badge" hidden>0</span></button>

<div id="maint" role="status" hidden><b>🛠 メンテナンス中</b><span>機能は使えますが、エラーやバグが起きることがあります</span></div>

<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('errbox');
  if(!d){d=document.createElement('pre');d.id='errbox';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#B3372B;color:#fff;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;max-height:40vh;overflow:auto';document.body.appendChild(d)}
  d.textContent+=(e.message||'error')+(e.lineno?' (行'+e.lineno+')':'')+'\n';
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script>
try{
if(!window.L){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:5rem;left:1rem;right:1rem;z-index:9999;background:#fff;padding:1rem;border-radius:1rem">地図ライブラリ(Leaflet)を読み込めませんでした。インターネット接続を確認して、ページを開き直してください。</p>');throw new Error('Leaflet not loaded')}
/* ===== 設定(必要ならここを書き換え) ===== */
// 多治見西高等学校(多治見市明和町1丁目18)の座標。
const CENTER=[35.351804,137.10176];
const R=3000;               // 登録できる範囲(m)
const RINGS=[500,1000,2000,3000];
const MAX_IMG=5;
const MAINTENANCE=false; // メンテナンス中の表示。消すときは false にしてください。
// ★ ログイン機能(Firebase)を使うときは、Firebaseの「ウェブアプリの設定」をここに貼り付けてください。
const FIREBASE_CONFIG={apiKey:'',authDomain:'',projectId:'',appId:''};

/* ===== 便利関数 ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#F2B01E';
const fmt=iso=>new Date(iso).toLocaleString(S.settings.lang==='en'?'en-US':'ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== 保存データ ===== */
const KEY='mitsugen-map-v1';
let S={items:[],notices:[],seeded:false,seenUpdates:[],hidden:[],hiddenItems:[],hiddenRanges:[],trash:[],noticeTrash:[],bloomMonth:0,bloomRanges:[],bloomUnset:true,toured:false,settings:{mapType:'normal',font:16,toast:true,pinSize:100,lineWidth:6,cluster:true,lang:'ja'}};
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S=Object.assign(S,d);S.settings=Object.assign({mapType:'normal',font:16,toast:true,pinSize:100,lineWidth:6,cluster:true,lang:'ja'},d.settings)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){flash('保存できませんでした。画像が多すぎる可能性があります');return false}}

/* ===== 地図 ===== */
const map=L.map('map',{zoomControl:false,maxZoom:21,zoomSnap:.5,maxBoundsViscosity:1});
L.control.zoom({position:'topright'}).addTo(map);
const bounds=L.latLngBounds(ringPts(R));
map.setView(CENTER,13);
map.setMaxBounds(bounds.pad(.12));
function limitZoom(){
  map.invalidateSize();
  const sz=map.getSize();if(!sz.x||!sz.y)return;
  map.setMinZoom(map.getBoundsZoom(bounds.pad(.12),false));
}
requestAnimationFrame(()=>{limitZoom();const sz=map.getSize();if(sz.x&&sz.y)map.fitBounds(bounds)});
addEventListener('resize',limitZoom);

const GSI='https://cyberjapandata.gsi.go.jp/xyz/';
const tiles={
  normal:L.tileLayer(GSI+'std/{z}/{x}/{y}.png',{maxNativeZoom:18,maxZoom:21,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'}),
  sat:L.tileLayer(GSI+'seamlessphoto/{z}/{x}/{y}.jpg',{maxNativeZoom:18,maxZoom:21,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'})
};
let tileWarned=false;
Object.values(tiles).forEach(t=>t.on('tileerror',()=>{if(!tileWarned){tileWarned=true;flash('地図画像を読み込めません。通信を確認してください')}}));
function setMapType(t){Object.values(tiles).forEach(l=>map.removeLayer(l));tiles[t].addTo(map);$('#map').classList.toggle('sat',t==='sat')}

function ringPts(r,n=180){const dLat=r/111320,dLng=r/(111320*Math.cos(CENTER[0]*Math.PI/180));return Array.from({length:n},(_,i)=>{const a=2*Math.PI*i/n;return[CENTER[0]+dLat*Math.cos(a),CENTER[1]+dLng*Math.sin(a)]})}
map.createPane('mask').style.zIndex=350;
// 3km外は半透明の黒
L.polygon([[[-85,-180],[-85,180],[85,180],[85,-180]],ringPts(R)],{pane:'mask',stroke:false,fillColor:'#000',fillOpacity:.5,interactive:false}).addTo(map);
RINGS.forEach(r=>{
  L.circle(CENTER,{radius:r,className:'ring',fill:false,weight:2.5,dashArray:'7 9',interactive:false}).addTo(map);
  L.marker([CENTER[0]+r/111320,CENTER[1]],{interactive:false,keyboard:false,icon:L.divIcon({className:'ringlab',html:`<span>${r>=1000?r/1000+'km':r+'m'}</span>`,iconSize:[0,0]})}).addTo(map);
});
L.marker(CENTER,{interactive:false,keyboard:false,icon:L.divIcon({className:'school',html:'<span>校</span>',iconSize:[0,0]})}).addTo(map).bindTooltip('多治見西高等学校');

/* ===== ピン・線の描画 ===== */
const itemGroup=L.layerGroup().addTo(map);
const layers=new Map();
const pinIcon=c=>{const k=(S.settings.pinSize||100)/100,w=Math.round(32*k),h=Math.round(42*k);return L.divIcon({className:'pin',html:`<svg viewBox="0 0 32 42" width="${w}" height="${h}"><path d="M16 1C8 1 2 7 2 15c0 10 14 26 14 26s14-16 14-26C30 7 24 1 16 1z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>`,iconSize:[w,h],iconAnchor:[w/2,h-1]})};
function drawItem(it){
  if(layers.has(it.id)){itemGroup.removeLayer(layers.get(it.id));layers.delete(it.id)}
  const c=safeColor(it.color);let l;
  if(it.type==='point'){
    l=L.marker(it.pts[0],{icon:pinIcon(c),bubblingMouseEvents:false});
    l.bindTooltip(it.name,{direction:'top',offset:[0,-Math.round(38*(S.settings.pinSize||100)/100)]});
  }else{
    l=L.featureGroup([L.polyline(it.pts,{color:'#fff',weight:(S.settings.lineWidth||6)+4,opacity:.9,lineCap:'round',bubblingMouseEvents:false}),L.polyline(it.pts,{color:c,weight:S.settings.lineWidth||6,lineCap:'round',bubblingMouseEvents:false})]);
    l.bindTooltip(it.name,{sticky:true});
  }
  l.on('click',()=>{if(busy||tmp.length)return;openDetail(it.id)});
  layers.set(it.id,l);
}
const RANGES=['〜500m','500m〜1km','1〜2km','2〜3km'];
const repPt=it=>it.type==='point'?it.pts[0]:it.pts[Math.floor(it.pts.length/2)];
const itemDist=it=>map.distance(CENTER,repPt(it));
const rangeOf=it=>{const d=itemDist(it);return d<500?0:d<1000?1:d<2000?2:3};
const inBloom=(b,m)=>b.from<=b.to?(m>=b.from&&m<=b.to):(m>=b.from||m<=b.to);
const bloomMonths=b=>{const a=[];let m=b.from;for(let i=0;i<12;i++){a.push(m);if(m===b.to)break;m=m%12+1}return a};
const bloomHit=(b,p)=>{const pm=bloomMonths(p);return bloomMonths(b).some(m=>pm.includes(m))};
const bloomOk=it=>!S.bloomRanges.length||(it.bloom?S.bloomRanges.some(p=>bloomHit(it.bloom,p)):S.bloomUnset!==false);
const bloomText=b=>b.from===b.to?`${b.from}月`:`${b.from}〜${b.to}月`;
const MOPT='<option value="">未設定</option>'+Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');
const isShown=it=>!S.hidden.includes(it.name)&&!S.hiddenItems.includes(it.id)&&!S.hiddenRanges.includes(rangeOf(it))&&bloomOk(it);
function revealItem(it){
  S.hidden=S.hidden.filter(n=>n!==it.name);
  S.hiddenItems=S.hiddenItems.filter(i=>i!==it.id);
  S.hiddenRanges=S.hiddenRanges.filter(r=>r!==rangeOf(it));
  if(!bloomOk(it))S.bloomRanges=[];
}
let editingId=null;
const CL_PX=44;
const clusterGroup=L.layerGroup().addTo(map);
function addCluster(list){
  const lat=list.reduce((a,i)=>a+i.pts[0][0],0)/list.length,lng=list.reduce((a,i)=>a+i.pts[0][1],0)/list.length;
  const k=(S.settings.pinSize||100)/100,w=Math.round(32*k),h=Math.round(42*k),c=safeColor(list[0].color);
  const m=L.marker([lat,lng],{zIndexOffset:500,icon:L.divIcon({className:'pin cl',html:`<svg viewBox="0 0 32 42" width="${w}" height="${h}"><path d="${PIN_PATH}" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg><b class="cnt">${list.length}</b>`,iconSize:[w,h],iconAnchor:[w/2,h-1]})});
  m.bindTooltip(`${list[0].name} ×${list.length}`,{direction:'top',offset:[0,-Math.round(38*k)]});
  m.on('click',()=>clusterClick(list));
  m.addTo(clusterGroup);
}
function clusterClick(list){
  const b=L.latLngBounds(list.map(i=>i.pts[0]));
  const tiny=map.distance(b.getSouthWest(),b.getNorthEast())<2;
  if(tiny||map.getZoom()>=map.getMaxZoom()-.5){openClusterList(list);return}
  map.flyToBounds(b.pad(.6),{maxZoom:map.getMaxZoom(),duration:.5});
}
function openClusterList(list){
  const w=document.createElement('div');
  list.forEach(i=>{
    const b=el(`<button class="card"><div class="im"><i style="background:${safeColor(i.color)}"></i></div><div class="tx"><b>${esc(i.name)}</b><small>${fmt(i.created)}${i.bloom?` ・ 開花${bloomText(i.bloom)}`:''}</small></div></button>`).firstChild;
    b.onclick=()=>{closeAllPops();focusItem(i.id)};
    w.appendChild(b);
  });
  openPop({title:`${list[0].name} ×${list.length}`,body:w});
}
function applyFilter(){
  clusterGroup.clearLayers();
  const gone=new Set();
  if(S.settings.cluster!==false){
    const byName=new Map();
    S.items.filter(it=>layers.has(it.id)&&it.type==='point'&&it.id!==editingId&&isShown(it)).forEach(it=>{if(!byName.has(it.name))byName.set(it.name,[]);byName.get(it.name).push(it)});
    byName.forEach(list=>{
      const pts=list.map(it=>({it,p:map.latLngToLayerPoint(it.pts[0])})),used=new Set();
      pts.forEach(a=>{
        if(used.has(a.it.id))return;
        const grp=[a];used.add(a.it.id);
        pts.forEach(b=>{if(!used.has(b.it.id)&&a.p.distanceTo(b.p)<=CL_PX){grp.push(b);used.add(b.it.id)}});
        if(grp.length>=2){grp.forEach(g=>gone.add(g.it.id));addCluster(grp.map(g=>g.it))}
      });
    });
  }
  S.items.forEach(it=>{
    const l=layers.get(it.id);if(!l)return;
    if(it.id===editingId&&it.type==='line')return;
    const show=isShown(it)&&!gone.has(it.id),has=itemGroup.hasLayer(l);
    if(show&&!has)itemGroup.addLayer(l);
    else if(!show&&has)itemGroup.removeLayer(l);
  });
}
map.on('zoomend',()=>applyFilter());
function updateFilterBadge(){const n=S.hidden.length+S.hiddenItems.length+S.hiddenRanges.length+S.bloomRanges.length;$('#fcnt').textContent=n;$('#fcnt').hidden=!n}
/* ===== 範囲・開花時期の絞り込み部品(表示する植物/植物一覧で共通) ===== */
function buildFilterAccs(st,open,onChange,items){
  const tg=(key,acc)=>{open.has(key)?open.delete(key):open.add(key);acc.classList.toggle('open',open.has(key))};
  const rc=RANGES.map(()=>0);items.forEach(i=>rc[rangeOf(i)]++);
  const ra=el(`<div class="acc ${open.has('#range')?'open':''}"><div class="acc-h"><button class="acc-t" type="button"><span class="nm">範囲ごとに切り替え(学校からの距離)</span><small>${st.hiddenRanges.length?`非表示 ${st.hiddenRanges.length}`:'すべて表示'}</small><span class="chev">▸</span></button></div><div class="acc-b"></div></div>`).firstChild;
  $('.acc-t',ra).onclick=()=>tg('#range',ra);
  RANGES.forEach((lab,ri)=>{
    const r=el(`<div class="irow"><label><input type="checkbox" ${st.hiddenRanges.includes(ri)?'':'checked'}><span class="tx2">${lab}</span></label><small>${rc[ri]}件</small></div>`).firstChild;
    $('input',r).onchange=ev=>{st.hiddenRanges=st.hiddenRanges.filter(x=>x!==ri);if(!ev.target.checked)st.hiddenRanges.push(ri);onChange()};
    $('.acc-b',ra).appendChild(r);
  });
  const nowM=new Date().getMonth()+1;
  const MS=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');
  const ba=el(`<div class="acc ${open.has('#bloom')?'open':''}"><div class="acc-h"><button class="acc-t" type="button"><span class="nm">開花時期で絞り込み</span><small>${st.bloomRanges.length?`${st.bloomRanges.length}期間`:'すべて表示'}</small><span class="chev">▸</span></button></div><div class="acc-b"><div class="cnt" style="margin:.3rem 0">指定した期間のどれかに咲くものだけ表示します(11月〜2月のように年をまたぐ指定もできます)</div><div id="pl-list"></div><div class="btns" style="margin:.4rem 0 .3rem"><button class="ghost" id="padd" type="button">＋ 期間を追加</button><button class="ghost" id="pnow" type="button">今月(${nowM}月)だけ</button><button class="ghost danger" id="pclr" type="button">クリア</button></div><div class="irow"><label><input type="checkbox" id="bu" ${st.bloomUnset!==false?'checked':''}><span class="tx2">開花時期が未設定のものも表示</span></label></div></div></div>`).firstChild;
  const pl=$('#pl-list',ba);
  st.bloomRanges.forEach((p,pi)=>{
    const r=el(`<div class="irow"><select class="mini pf">${MS}</select><span>〜</span><select class="mini pt">${MS}</select><button class="ghost danger go" type="button" aria-label="この期間を削除">×</button></div>`).firstChild;
    $('.pf',r).value=String(p.from);$('.pt',r).value=String(p.to);
    $('.pf',r).onchange=e=>{p.from=+e.target.value;onChange()};
    $('.pt',r).onchange=e=>{p.to=+e.target.value;onChange()};
    $('.go',r).onclick=()=>{st.bloomRanges.splice(pi,1);onChange()};
    pl.appendChild(r);
  });
  if(!st.bloomRanges.length)pl.innerHTML='<div class="cnt" style="margin:.2rem 0">期間が指定されていません(すべて表示)</div>';
  $('.acc-t',ba).onclick=()=>tg('#bloom',ba);
  $('#padd',ba).onclick=()=>{if(st.bloomRanges.length>=6){flash('期間は6つまでです');return}st.bloomRanges.push({from:nowM,to:nowM});open.add('#bloom');onChange()};
  $('#pnow',ba).onclick=()=>{st.bloomRanges=[{from:nowM,to:nowM}];open.add('#bloom');onChange()};
  $('#pclr',ba).onclick=()=>{st.bloomRanges=[];onChange()};
  $('#bu',ba).onchange=e=>{st.bloomUnset=e.target.checked;onChange()};
  return[ra,ba];
}
function openMapFilter(){
  const open=new Set();
  const w=el(`
    <div class="filters" style="grid-template-columns:1fr"><label class="f">検索<input id="mq" type="search" placeholder="植物名で探す"></label></div>
    <div class="acc" id="optacc"><div class="acc-h"><button class="acc-t" type="button"><span class="nm">絞り込み・並び替え・範囲・開花時期</span><small id="optsum"></small><span class="chev">▸</span></button></div><div class="acc-b">
      <div class="filters">
        <label class="f">種類<select id="mk"><option value="all">すべて</option><option value="point">点があるもの</option><option value="line">線があるもの</option></select></label>
        <label class="f">状態<select id="ms"><option value="all">すべて</option><option value="on">表示中</option><option value="off">非表示</option></select></label>
        <label class="f">並び替え<select id="mo"><option value="name">名前順</option><option value="count">件数が多い順</option><option value="new">新しい順</option></select></label>
      </div>
      <div class="btns"><button class="ghost" id="fa">一覧をすべて表示</button><button class="ghost" id="fn">一覧をすべて非表示</button></div>
      <div id="fr"></div>
    </div></div><div class="cnt" id="fcn"></div><div id="fl"></div>`);
  const all=()=>{
    const m=new Map();
    S.items.forEach(i=>{const e=m.get(i.name)||{name:i.name,items:[],c:i.color,types:new Set(),t:''};e.items.push(i);e.types.add(i.type);if(i.created>e.t)e.t=i.created;m.set(i.name,e)});
    return[...m.values()];
  };
  const shown=()=>{
    const q=$('#mq',w).value.trim().toLowerCase(),k=$('#mk',w).value,st=$('#ms',w).value,o=$('#mo',w).value;
    const a=all().filter(e=>(!q||e.name.toLowerCase().includes(q))&&(k==='all'||e.types.has(k))&&(st==='all'||(st==='on')===!S.hidden.includes(e.name)));

// 曲線: 指定した点をすべて通るなめらかな曲線(Catmull-Rom)
const PER=20;
function curve(raw){
  const out=[],n=raw.length;
  for(let i=0;i<n-1;i++){
    const p0=raw[i-1]||raw[i],p1=raw[i],p2=raw[i+1],p3=raw[i+2]||raw[i+1];
    for(let k=0;k<PER;k++){
      const t=k/PER,t2=t*t,t3=t2*t;
      out.push([0,1].map(d=>0.5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)));
    }
  }
  out.push(raw[n-1].slice());
  return out;
}
function drawTmp(){
  tmpLayer.clearLayers();
  if(tool==='point')return;
  tmp.forEach((p,i)=>{
    const m=L.circleMarker(p,{radius:8,color:'#fff',weight:3,fillColor:'#2F5D3A',fillOpacity:1,interactive:false}).addTo(tmpLayer);
  });
  if(tool==='line'&&tmp.length>=2){
    const dash=lineKind==='curve'&&tmp.length<3;
    L.polyline(lineKind==='curve'&&tmp.length===3?curve(tmp):tmp,{color:'#F2B01E',weight:5,dashArray:dash?'4 8':null,interactive:false}).addTo(tmpLayer);
  }
}
map.on('click',e=>{
  if(mode!=='edit'||busy)return;
  if(map.distance(CENTER,e.latlng)>R){flash('3km圏外には登録できません');return}
  const ll=[e.latlng.lat,e.latlng.lng];
  if(tool==='point'){tmp=[ll];drawTmp();openNew({type:'point',pts:[ll]});return}
  const need=lineKind==='curve'?3:2;
  tmp.push(ll);drawTmp();
  if(tmp.length===need)openNew({type:'line',lineKind,pts:need===3?curve(tmp):tmp.slice(),raw:tmp.slice()});
  updateHint();
});

/* ===== 位置情報 ===== */
let watchId=null,locMk=null,locCirc=null,lastLoc=null;
const locLayer=L.layerGroup().addTo(map);
const locErr=err=>{stopLocate();flash(err&&err.code===1?'位置情報の利用が許可されていません。ブラウザの設定で許可してください':'現在地を取得できませんでした')};
function setLoc(la,lo,ac){
  lastLoc=[la,lo];
  if(!locMk){
    locCirc=L.circle([la,lo],{radius:ac,color:'#2a7de1',weight:1,fillColor:'#2a7de1',fillOpacity:.14,interactive:false}).addTo(locLayer);
    locMk=L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#2a7de1',fillOpacity:1,interactive:false}).addTo(locLayer);
  }else{locMk.setLatLng([la,lo]);locCirc.setLatLng([la,lo]);locCirc.setRadius(ac)}
}
function startLocate(){
  if(!navigator.geolocation){flash('この端末では位置情報が使えません');return}
  let first=true;
  $('#btn-loc').setAttribute('aria-pressed','true');
  watchId=navigator.geolocation.watchPosition(p=>{
    const la=p.coords.latitude,lo=p.coords.longitude;
    setLoc(la,lo,p.coords.accuracy);
    if(first){first=false;if(map.distance(CENTER,[la,lo])<=R)map.flyTo([la,lo],Math.max(map.getZoom(),16),{duration:.6});else flash('現在地は3km圏外です')}
  },locErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopLocate(){
  if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
  watchId=null;locLayer.clearLayers();locMk=locCirc=null;lastLoc=null;
  $('#btn-loc').setAttribute('aria-pressed','false');
}
const setLocate=on=>on?startLocate():stopLocate();
$('#btn-loc').onclick=()=>{
  if(watchId===null){startLocate();return}
  if(lastLoc&&map.distance(CENTER,lastLoc)<=R)map.flyTo(lastLoc,Math.max(map.getZoom(),16),{duration:.5});
  else flash('現在地は3km圏外です');
};
$('#b-here').onclick=()=>{
  if(mode!=='edit'||busy)return;
  const go=(la,lo)=>{
    if(map.distance(CENTER,[la,lo])>R){flash('現在地が3km圏外のため登録できません');return}
    tmp=[[la,lo]];map.flyTo([la,lo],Math.max(map.getZoom(),17),{duration:.5});
    openNew({type:'point',pts:[[la,lo]]});
  };
  if(lastLoc){go(lastLoc[0],lastLoc[1]);return}
  if(!navigator.geolocation){flash('この端末では位置情報が使えません');return}
  navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),locErr,{enableHighAccuracy:true,timeout:20000});
};

function openPop({title,body,cls='',onClose,side=false}){

  ov.innerHTML=`<div class="pop ${cls}" role="dialog" aria-modal="true"><div class="pop-h"><h2></h2><button class="x" aria-label="閉じる">×</button></div><div class="pop-b"></div></div>`;

  $('.x',ov).onclick=close;
  ov.addEventListener('pointerdown',e=>{if(e.target===ov)close()});
  document.body.appendChild(ov);

}
const closeAllPops=()=>$$('.ov').reverse().forEach(o=>o._close());
addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$$('.ov').pop();o&&o._close()}});
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html;return d};

function readImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function openNew(d){

function openDetail(id){const it=S.items.find(i=>i.id===id);if(it)openEditor(it,false)}
function openEditor(item,isNew){
  busy=true;updateHint();editingId=item.id;applyFilter();
  let imgs=[...item.images],locked=!isNew;
  let pos=item.pts[0],orig=item.pts[0],saved=false,mk=null;
  const origPts=JSON.stringify(item.pts);
  let raw=null,editLayer=null,hiddenLayer=null,onColor=()=>{};
  const clampLL=ll=>{const d=map.distance(CENTER,ll);if(d<=R)return ll;const k=(R-1)/d;return L.latLng(CENTER[0]+(ll.lat-CENTER[0])*k,CENTER[1]+(ll.lng-CENTER[1])*k)};
  const onDragEnd=()=>{if(locked){locked=false;lock()}};
  const onDrag=()=>{const a=mk.getLatLng(),c=clampLL(a);if(c!==a)mk.setLatLng(c);pos=[c.lat,c.lng]};
  if(item.type==='point'&&mode==='edit'){
    mk=isNew?L.marker(pos,{icon:pinIcon(safeColor(item.color)),zIndexOffset:1000}).addTo(tmpLayer):layers.get(item.id);
    if(mk){mk.on('drag',onDrag);mk.on('dragend',onDragEnd)}
  }
  const w=el(`
    <label class="f">植物名<input id="f-name" type="text" maxlength="40" placeholder="例:ナナカマド" autocomplete="off"></label>
    <div id="f-err" class="err" hidden></div>
    <div id="f-drag" class="err" style="color:var(--leaf);margin:-.4rem 0 .9rem" hidden>📍 地図のピンをドラッグすると位置を変えられます(3km圏内)</div>
    <label class="f">ピンの色<input id="f-color" type="color"></label>
    <div class="f">画像を追加(${MAX_IMG}枚まで) <span id="f-cnt" style="font-weight:400"></span>
      <input id="f-file" type="file" accept="image/*" multiple style="display:block;margin-top:.4rem;font-weight:400">
      <div id="f-th" class="thumbs"></div></div>
    <div class="f">開花時期<div class="bl"><select id="f-b1">${MOPT}</select><span>〜</span><select id="f-b2">${MOPT}</select></div></div>
    <label class="f">その他<textarea id="f-note" rows="3" maxlength="500" placeholder="気づいたことなど"></textarea></label>
    <div class="btns" id="f-cbtn" hidden style="margin:0 0 .9rem;flex-wrap:wrap"><button id="b-add" type="button" class="ghost">＋ 曲がる点を追加</button><button id="b-rm" type="button" class="ghost danger">選んだ点を削除</button></div>
    <div class="btns"><button id="b-del" class="ghost danger">削除</button><span class="sp"></span><button id="b-edit" class="ghost">編集</button><button id="b-ok" class="primary">決定</button></div>`);
  const $f=s=>$(s,w);
  $f('#f-name').value=item.name;$f('#f-color').value=safeColor(item.color);$f('#f-note').value=item.note;
  $f('#f-b1').value=item.bloom?item.bloom.from:'';$f('#f-b2').value=item.bloom?item.bloom.to:'';
  $f('#f-color').oninput=()=>{onColor();if(mk)mk.setIcon(pinIcon(safeColor($f('#f-color').value)))};
  if(item.type==='line'&&mode==='edit'){
    const isCurve=item.lineKind==='curve',MAXP=12;
    raw=item.raw?item.raw.map(p=>p.slice()):(isCurve?[item.pts[0],item.pts[Math.floor(item.pts.length/2)],item.pts[item.pts.length-1]]:[item.pts[0],item.pts[item.pts.length-1]]);
    let sel=-1,handles=[],moveMk=null;
    const linePts=()=>isCurve?curve(raw):raw.map(p=>p.slice());
    const centerOf=()=>isCurve?curve(raw)[Math.floor(PER/2)]:[(raw[0][0]+raw[1][0])/2,(raw[0][1]+raw[1][1])/2];
    const allInside=r=>r.every(p=>map.distance(CENTER,p)<=R);
    const col=()=>safeColor($f('#f-color').value);
    tmpLayer.clearLayers();
    editLayer=L.layerGroup().addTo(map);
    const old=layers.get(item.id);
    if(!isNew&&old){itemGroup.removeLayer(old);hiddenLayer=old}
    const casing=L.polyline(linePts(),{color:'#fff',weight:Math.max((S.settings.lineWidth||6)+4,14),opacity:.9,lineCap:'round',bubblingMouseEvents:false}).addTo(editLayer);
    const line=L.polyline(linePts(),{color:col(),weight:S.settings.lineWidth||6,lineCap:'round',interactive:false}).addTo(editLayer);
    const guide=isCurve?L.polyline(raw,{color:'#fff',weight:2,dashArray:'4 6',interactive:false}).addTo(editLayer):null;
    const hLayer=L.layerGroup().addTo(editLayer);
    const refreshLine=()=>{const p=linePts();casing.setLatLngs(p);line.setLatLngs(p);if(guide)guide.setLatLngs(raw)};
    const hIcon=(c,html='<span></span>')=>L.divIcon({className:'handle '+c,html,iconSize:[30,30],iconAnchor:[15,15]});
    const ARROWS='<span><svg viewBox="0 0 24 24" fill="none" stroke="#2F5D3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></span>';
    const updateBtns=()=>{if(!isCurve)return;$f('#b-rm').disabled=!(sel>0&&sel<raw.length-1);$f('#b-add').disabled=raw.length>=MAXP};
    function rebuild(){
      hLayer.clearLayers();refreshLine();
      handles=raw.map((p,i)=>{
        const cls=i===0?'st':i===raw.length-1?'en':'bd';
        const h=L.marker(p,{draggable:true,icon:hIcon(cls+(i===sel?' sel':'')),zIndexOffset:2000}).addTo(hLayer);
        h.on('drag',()=>{const a=h.getLatLng(),c=clampLL(a);if(c!==a)h.setLatLng(c);raw[i]=[c.lat,c.lng];refreshLine();moveMk.setLatLng(centerOf())});
        h.on('dragend',onDragEnd);
        if(cls==='bd')h.on('click',()=>{sel=sel===i?-1:i;rebuild()});
        return h;
      });
      moveMk=L.marker(centerOf(),{draggable:true,icon:hIcon('mv',ARROWS),zIndexOffset:2100}).addTo(hLayer);

        const ll=moveMk.getLatLng(),d=[ll.lat-startLL.lat,ll.lng-startLL.lng];
        const nr=startRaw.map(p=>[p[0]+d[0],p[1]+d[1]]);

    $f('#b-edit').disabled=!(locked&&mode==='edit');
    $f('#b-ok').disabled=locked;
    $f('#b-del').hidden=isNew||mode!=='edit';
    if(mk&&mk.dragging)mk.dragging.enable();
    $f('#f-drag').hidden=!(mk||raw);
    thumbs();
  }
  lock();
  $f('#f-file').onchange=async e=>{
    for(const f of e.target.files){
      if(imgs.length>=MAX_IMG){flash(`画像は${MAX_IMG}枚までです`);break}
      try{imgs.push(await readImg(f))}catch(_){flash('画像を読み込めませんでした')}
    }
    e.target.value='';thumbs();
  };
  $f('#b-edit').onclick=()=>{locked=false;lock();$f('#f-name').focus()};
  $f('#b-del').onclick=async()=>{
    if(!await askConfirm(`「${item.name}」をゴミ箱に移動しますか?\n(植物一覧のゴミ箱から、30日以内なら復元できます)`,'ゴミ箱に移動'))return;
    const gone=S.items.find(i=>i.id===item.id);
    S.items=S.items.filter(i=>i.id!==item.id);
    if(gone){S.trash.unshift(Object.assign({},gone,{deletedAt:new Date().toISOString()}));S.trash=S.trash.slice(0,50)}
    if(layers.has(item.id)){itemGroup.removeLayer(layers.get(item.id));layers.delete(item.id)}
    save();saved=true;pop.close();applyFilter();addNotice('del',`「${item.name}」をゴミ箱に移動しました`,`${kind}をゴミ箱に移動しました。\n植物一覧の「ゴミ箱」から、30日以内なら復元できます。`);
  };
  $f('#b-ok').onclick=()=>{
    const name=$f('#f-name').value.trim();
    if(!name){const e=$f('#f-err');e.textContent='植物名を入力してください';e.hidden=false;$f('#f-name').focus();return}
    const now=new Date().toISOString();
    const data={name,color:$f('#f-color').value,images:imgs,note:$f('#f-note').value.trim(),updated:now,bloom:(()=>{const a=+$f('#f-b1').value,b=+$f('#f-b2').value;return a?{from:a,to:b||a}:null})()};
    if(item.type==='point')data.pts=[pos];
    else if(raw){data.pts=w._linePts();data.raw=raw.map(p=>p.slice())}
    if(isNew){
      const it=Object.assign({},item,data,{id:uid(),created:now});
      S.items.push(it);revealItem(it);drawItem(it);applyFilter();updateFilterBadge();
      if(!save()){S.items.pop();itemGroup.removeLayer(layers.get(it.id));layers.delete(it.id);return}
      saved=true;pop.close();
      const d=Math.round(map.distance(CENTER,it.pts[0])/10)*10;
      addNotice('add',`「${name}」を追加しました`,`${kind}として登録しました。\n学校から約${d}mの位置です。`+(it.note?`\n\nメモ: ${it.note}`:''),it.id);
    }else{
      const it=S.items.find(i=>i.id===item.id);Object.assign(it,data);revealItem(it);drawItem(it);applyFilter();updateFilterBadge();
      if(!save())return;
      saved=true;pop.close();
      const moved=JSON.stringify(data.pts)!==origPts;
      addNotice('edit',`「${name}」を編集しました`,`${kind}の内容を更新しました。`+(moved?'\n位置や形を変更しました。':''),it.id);
    }
  };
  const pop=openPop({title:isNew?`${kind}を登録`:item.name,body:w,side:true,onClose:()=>{
    busy=false;editingId=null;
    if(mk){mk.off('drag',onDrag);mk.off('dragend',onDragEnd);if(mk.dragging)mk.dragging.disable();if(!isNew&&!saved){mk.setLatLng(orig);mk.setIcon(pinIcon(safeColor(item.color)))}}
    if(editLayer){map.removeLayer(editLayer);if(!saved&&hiddenLayer)itemGroup.addLayer(hiddenLayer)}
    resetDraw();applyFilter();
  }});
}

/* ===== 植物一覧 ===== */
function openPlants(){
  const open=new Set(),lf={hiddenRanges:[],bloomRanges:[],bloomUnset:true};
  const w=el(`<div class="toprow"><label class="f" id="sw">検索<input id="q" type="search" placeholder="植物名・メモで探す"></label><div class="seg full" id="tabs"><button type="button" data-t="list" aria-pressed="true">一覧</button><button type="button" data-t="trash" aria-pressed="false">🗑 ゴミ箱 <span id="tc"></span></button></div></div>
    <div id="pl">
      <div class="acc" id="optacc"><div class="acc-h"><button class="acc-t" type="button"><span class="nm">絞り込み・並び替え・範囲・開花時期</span><small id="optsum"></small><span class="chev">▸</span></button></div><div class="acc-b">
        <div class="filters">
          <label class="f">種類<select id="ft"><option value="all">すべて</option><option value="point">点</option><option value="line">線</option></select></label>
          <label class="f">状態<select id="fv"><option value="all">すべて</option><option value="on">地図に表示中</option><option value="off">地図で非表示</option></select></label>
          <label class="f">並び替え<select id="so"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前順</option></select></label>
        </div>
        <label class="chk" style="margin:0 0 .5rem"><input type="checkbox" id="fi">画像あり</label>
        <div id="fr"></div>
      </div></div>
      <div class="cnt" id="cnt"></div><div id="ls"></div>
    </div>
    <div id="tr" hidden></div>`);
  const sel=id=>$(id,w).selectedOptions[0].textContent;
  const draw=()=>{
    const q=$('#q',w).value.trim().toLowerCase(),ft=$('#ft',w).value,fv=$('#fv',w).value,so=$('#so',w).value,fi=$('#fi',w).checked;
    const parts=[];
    if(ft!=='all')parts.push(sel('#ft'));if(fv!=='all')parts.push(sel('#fv'));if(so!=='new')parts.push(sel('#so'));if(fi)parts.push('画像あり');
    if(lf.hiddenRanges.length)parts.push(`範囲 ${lf.hiddenRanges.length}`);
    if(lf.bloomRanges.length)parts.push(`開花 ${lf.bloomRanges.length}期間`);
    $('#optsum',w).textContent=parts.length?parts.join(' ・ '):'条件なし';
    let a=S.items.filter(i=>(ft==='all'||i.type===ft)&&(fv==='all'||(fv==='on')===isShown(i))&&(!fi||i.images.length)
      &&!lf.hiddenRanges.includes(rangeOf(i))
      &&(!lf.bloomRanges.length||(i.bloom?lf.bloomRanges.some(p=>bloomHit(i.bloom,p)):lf.bloomUnset!==false))
      &&(!q||(i.name+' '+i.note).toLowerCase().includes(q)));
    a.sort((x,y)=>so==='name'?x.name.localeCompare(y.name,'ja'):so==='old'?x.created.localeCompare(y.created):y.created.localeCompare(x.created));
    $('#cnt',w).textContent=`${a.length}件`;
    $('#tc',w).textContent=S.trash.length?`(${S.trash.length})`:'';
    const ls=$('#ls',w);ls.innerHTML='';
    if(!a.length){ls.innerHTML=`<div class="empty">${S.items.length?'条件に合う植物がありません。':'まだ植物が登録されていません。<br>編集に切り替えて、地図をタップして追加しましょう。'}</div>`;return}
    a.forEach(i=>{
      const kind=i.type==='point'?'点':(i.lineKind==='curve'?'曲線':'直線');
      const b=el(`<button class="card"><div class="im">${i.images[0]?'<img alt="">':`<i style="background:${safeColor(i.color)}"></i>`}</div><div class="tx"><b>${esc(i.name)}</b><small>${kind} ・ ${fmt(i.created)}${i.bloom?` ・ 開花${bloomText(i.bloom)}`:''}${i.images.length?` ・ 画像${i.images.length}`:''}</small></div></button>`).firstChild;
      if(i.images[0])$('img',b).src=i.images[0];
      b.onclick=()=>{closeAllPops();focusItem(i.id)};
      ls.appendChild(b);
    });
  };
  const buildFr=()=>{const fr=$('#fr',w);fr.innerHTML='';buildFilterAccs(lf,open,refresh,S.items).forEach(a=>fr.appendChild(a))};
  const refresh=()=>{buildFr();draw()};
  $('#optacc .acc-t',w).onclick=()=>$('#optacc',w).classList.toggle('open');
  const drawTrash=()=>{
    const tr=$('#tr',w);tr.innerHTML='';
    $('#tc',w).textContent=S.trash.length?`(${S.trash.length})`:'';
    if(!S.trash.length){tr.innerHTML='<div class="empty">ゴミ箱は空です。<br>削除した植物は30日間ここに残り、復元できます。</div>';return}
    const top=el(`<div class="btns" style="margin:0 0 .5rem"><span class="sp"></span><button class="ghost danger" id="te" type="button" style="flex:none">ゴミ箱を空にする</button></div>`).firstChild;
    $('#te',top).onclick=async()=>{if(!await askConfirm('ゴミ箱の中身をすべて完全に削除します。元に戻せません。','空にする'))return;S.trash=[];save();drawTrash()};
    tr.appendChild(top);
    S.trash.forEach(i=>{
      const days=Math.max(0,30-Math.floor((Date.now()-new Date(i.deletedAt).getTime())/864e5));
      const c=el(`<div class="card"><div class="im">${i.images&&i.images[0]?'<img alt="">':`<i style="background:${safeColor(i.color)}"></i>`}</div><div class="tx"><b>${esc(i.name)}</b><small>削除 ${fmt(i.deletedAt)} ・ あと${days}日</small></div><button class="ghost go" data-a="r" type="button">復元</button><button class="ghost danger go" data-a="d" type="button">消す</button></div>`).firstChild;
      if(i.images&&i.images[0])$('img',c).src=i.images[0];
      $('[data-a=r]',c).onclick=()=>{restoreItem(i.id);drawTrash();refresh()};
      $('[data-a=d]',c).onclick=async()=>{if(!await askConfirm(`「${i.name}」を完全に削除します。元に戻せません。`,'完全に削除'))return;S.trash=S.trash.filter(t=>t.id!==i.id);save();drawTrash()};
      tr.appendChild(c);
    });
  };
  $('#tabs',w).onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    $$('#tabs button',w).forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#pl',w).hidden=b.dataset.t!=='list';$('#tr',w).hidden=b.dataset.t!=='trash';
    $('#sw',w).style.visibility=b.dataset.t==='list'?'':'hidden';
    if(b.dataset.t==='trash')drawTrash();
  };
  ['input','change'].forEach(ev=>w.addEventListener(ev,e=>{if(e.target.matches('#q,#ft,#fv,#so,#fi'))draw()}));
  buildFr();draw();openPop({title:'植物一覧',body:w,cls:'compact'});
}
function focusItem(id){
  const it=S.items.find(i=>i.id===id),l=layers.get(id);if(!it||!l)return;
  if(!isShown(it)){revealItem(it);applyFilter();save();updateFilterBadge()}
  if(it.type==='point')map.flyTo(it.pts[0],Math.max(map.getZoom(),16),{duration:.6});
  else map.flyToBounds(l.getBounds().pad(.4),{maxZoom:17,duration:.6});
  setTimeout(()=>openDetail(id),700);
}

/* ===== お知らせ ===== */
const KINDS={add:'追加',edit:'編集',del:'削除',upd:'アップデート'};
function addNotice(kind,title,body,itemId,silent){
  const n={id:uid(),kind,title,body,itemId:itemId||null,time:new Date().toISOString(),read:false};
  S.notices.unshift(n);S.notices=S.notices.slice(0,100);save();updateBadge();
  if(!silent)toast(n);
}
function updateBadge(){const u=S.notices.filter(n=>!n.read).length;$('#badge').textContent=u;$('#badge').hidden=!u}
function showToast(t,life){
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove();
  box.appendChild(t);
  setTimeout(()=>t.classList.add('fade'),life-1600);
  setTimeout(()=>t.remove(),life);
}
function toast(n){
  if(!S.settings.toast)return;
  const t=el(`<div class="toast" role="status"><b>${esc(n.title)}</b><span>${esc(KINDS[n.kind])}のお知らせ</span></div>`).firstChild;
  t.onclick=()=>{t.remove();openNotice(n)};
  showToast(t,5000);
}
function flash(msg){
  const t=el(`<div class="toast warn" role="alert"></div>`).firstChild;t.textContent=msg;
  showToast(t,3200);
}
function trashNotice(id){
  const n=S.notices.find(x=>x.id===id);if(!n)return;
  S.notices=S.notices.filter(x=>x.id!==id);
  S.noticeTrash.unshift(Object.assign({},n,{deletedAt:new Date().toISOString()}));S.noticeTrash=S.noticeTrash.slice(0,100);
  save();updateBadge();
}
function restoreNotice(id){
  const n=S.noticeTrash.find(x=>x.id===id);if(!n)return;
  S.noticeTrash=S.noticeTrash.filter(x=>x.id!==id);
  const c=Object.assign({},n);delete c.deletedAt;
  S.notices.push(c);S.notices.sort((a,b)=>b.time.localeCompare(a.time));
  save();updateBadge();
}
function openNotices(){
  const w=el(`<div class="toprow" style="justify-content:flex-end"><div class="seg full sm" id="ntabs"><button type="button" data-t="list" aria-pressed="true">お知らせ</button><button type="button" data-t="trash" aria-pressed="false">🗑 ゴミ箱 <span id="ntc"></span></button></div></div>
    <div id="npl">
      <div class="filters">
        <label class="f">種類<select id="nk"><option value="all">すべて</option>${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
        <label class="f">並び替え<select id="ns"><option value="new">新しい順</option><option value="old">古い順</option><option value="unread">未読を先に</option></select></label>
        <label class="chk wide"><input type="checkbox" id="nu">未読だけ</label>
      </div>
      <div class="toprow" style="margin:.2rem 0 .5rem"><div class="cnt" id="ncnt" style="flex:1;margin:0"></div><button class="ghost danger sm" id="nall" type="button">表示中をゴミ箱へ</button></div>
      <div id="nl"></div>
    </div>
    <div id="ntr" hidden></div>`);
  let cur=[];
  const draw=()=>{
    const k=$('#nk',w).value,so=$('#ns',w).value,u=$('#nu',w).checked;
    const a=S.notices.filter(n=>(k==='all'||n.kind===k)&&(!u||!n.read));
    a.sort((x,y)=>so==='old'?x.time.localeCompare(y.time):so==='unread'?((x.read-y.read)||y.time.localeCompare(x.time)):y.time.localeCompare(x.time));
    cur=a;
    $('#ncnt',w).textContent=`${a.length}件`;$('#nall',w).hidden=!a.length;
    $('#ntc',w).textContent=S.noticeTrash.length?`(${S.noticeTrash.length})`:'';
    const nl=$('#nl',w);nl.innerHTML='';
    if(!a.length){nl.innerHTML=`<div class="empty">${S.notices.length?'条件に合うお知らせがありません。':'お知らせはまだありません。'}</div>`;return}
    a.forEach(n=>{
      const row=el(`<div class="card nt">${n.read?'':'<span class="dot"></span>'}<button class="nmain" type="button"><div class="tx"><b>${esc(n.title)}</b><small><span class="chip ${n.kind}">${KINDS[n.kind]}</span>${fmt(n.time)}</small><small class="pv">${esc(n.body)}</small></div></button><button class="ghost danger go" type="button" data-a="d">削除</button></div>`).firstChild;
      $('.nmain',row).onclick=()=>openNotice(n,draw);
      $('[data-a=d]',row).onclick=()=>{trashNotice(n.id);draw()};
      nl.appendChild(row);
    });
  };
  const drawTrash=()=>{
    const tr=$('#ntr',w);tr.innerHTML='';
    $('#ntc',w).textContent=S.noticeTrash.length?`(${S.noticeTrash.length})`:'';
    if(!S.noticeTrash.length){tr.innerHTML='<div class="empty">ゴミ箱は空です。<br>削除したお知らせは30日間ここに残り、復元できます。</div>';return}
    const top=el(`<div class="toprow" style="justify-content:flex-end;margin-bottom:.5rem"><button class="ghost danger sm" id="nte" type="button">ゴミ箱を空にする</button></div>`).firstChild;
    $('#nte',top).onclick=async()=>{if(!await askConfirm('お知らせのゴミ箱の中身をすべて完全に削除します。元に戻せません。','空にする'))return;S.noticeTrash=[];save();drawTrash();draw()};
    tr.appendChild(top);
    S.noticeTrash.forEach(n=>{
      const days=Math.max(0,30-Math.floor((Date.now()-new Date(n.deletedAt).getTime())/864e5));
      const c=el(`<div class="card"><div class="tx"><b>${esc(n.title)}</b><small><span class="chip ${n.kind}">${KINDS[n.kind]}</span>削除 ${fmt(n.deletedAt)} ・ あと${days}日</small></div><button class="ghost go" data-a="r" type="button">復元</button><button class="ghost danger go" data-a="d" type="button">消す</button></div>`).firstChild;
      $('[data-a=r]',c).onclick=()=>{restoreNotice(n.id);drawTrash();draw()};
      $('[data-a=d]',c).onclick=async()=>{if(!await askConfirm(`「${n.title}」を完全に削除します。元に戻せません。`,'完全に削除'))return;S.noticeTrash=S.noticeTrash.filter(x=>x.id!==n.id);save();drawTrash()};
      tr.appendChild(c);
    });
  };
  $('#ntabs',w).onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    $$('#ntabs button',w).forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#npl',w).hidden=b.dataset.t!=='list';$('#ntr',w).hidden=b.dataset.t!=='trash';
    if(b.dataset.t==='trash')drawTrash();else draw();
  };
  $('#nall',w).onclick=async()=>{
    if(!cur.length)return;
    if(!await askConfirm(`表示中の${cur.length}件をゴミ箱に移動しますか?`,'ゴミ箱に移動'))return;
    cur.slice().forEach(n=>trashNotice(n.id));draw();
  };
  ['input','change'].forEach(ev=>w.addEventListener(ev,e=>{if(e.target.matches('#nk,#ns,#nu'))draw()}));
  draw();openPop({title:'お知らせ',body:w});
}
function openNotice(n,after){
  n.read=true;save();updateBadge();
  const w=el(`<span class="chip ${n.kind}">${KINDS[n.kind]}</span><small style="color:var(--mut)">${fmt(n.time)}</small><div class="nbody">${esc(n.body)}</div>`);
  if(n.itemId&&S.items.some(i=>i.id===n.itemId)){
    const b=el('<button class="primary">地図で見る</button>').firstChild;
    b.onclick=()=>{closeAllPops();focusItem(n.itemId)};w.appendChild(b);
  }
  const bar=el(`<div class="btns" style="margin-top:1rem"><span class="sp"></span><button class="ghost danger sm" id="nd" type="button">削除</button></div>`).firstChild;
  $('#nd',bar).onclick=()=>{trashNotice(n.id);pop.close();info('お知らせをゴミ箱に移動しました')};
  w.appendChild(bar);
  const pop=openPop({title:n.title,body:w,cls:'big',onClose:()=>after&&after()});
}

/* ===== ドロワー・ナビ ===== */
const drawer=$('#drawer'),scrim=$('#scrim');
function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');drawer.setAttribute('aria-hidden','false')}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
$('#btn-menu').onclick=openDrawer;scrim.onclick=closeDrawer;
function setNav(){}
function go(n){

function cleanItem(o){
  if(!o||typeof o!=='object')return null;
  const type=o.type==='line'?'line':o.type==='point'?'point':null;if(!type)return null;
  const okPt=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite);
  const pts=(Array.isArray(o.pts)?o.pts:[]).slice(0,500).filter(okPt).map(p=>[p[0],p[1]]);
  if(type==='point'?pts.length<1:pts.length<2)return null;
  if(!pts.every(p=>map.distance(CENTER,p)<=R+100))return null;
  const name=String(o.name||'').trim().slice(0,40);if(!name)return null;
  const now=new Date().toISOString();
  const it={id:typeof o.id==='string'&&o.id?o.id.slice(0,40):uid(),type,name,pts:type==='point'?[pts[0]]:pts,color:safeColor(o.color),
    images:(Array.isArray(o.images)?o.images:[]).filter(x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(x)).slice(0,MAX_IMG),
    note:String(o.note||'').slice(0,500),created:typeof o.created==='string'?o.created:now,updated:typeof o.updated==='string'?o.updated:now};
  if(type==='line'){
    it.lineKind=o.lineKind==='curve'?'curve':'straight';
    const raw=(Array.isArray(o.raw)?o.raw:[]).slice(0,12).filter(okPt).map(p=>[p[0],p[1]]);
    if(raw.length>=2)it.raw=raw;
  }
  const b=o.bloom,okM=m=>Number.isInteger(m)&&m>=1&&m<=12;
  if(b&&okM(b.from)&&okM(b.to))it.bloom={from:b.from,to:b.to};
  return it;
}
function openImport(){
  const w=el(`<p style="margin:0 0 .8rem;line-height:1.8">「データの書き出し」で保存したファイル(.json)を選んでください。</p><input id="im" type="file" accept=".json,application/json" style="display:block;margin-bottom:1rem"><div id="imr"></div>`);
  let parsed=null;
  $('#im',w).onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const out=$('#imr',w);out.innerHTML='';parsed=null;
    const bad=m=>{out.innerHTML=`<div class="err">${m}</div>`};
    if(f.size>30*1024*1024){bad('ファイルが大きすぎます(30MBまで)');return}
    let d;try{d=JSON.parse(await f.text())}catch(_){bad('ファイルを読み込めませんでした。書き出したファイルか確認してください。');return}
    if(!d||d.app!=='mitsugen-map'||!Array.isArray(d.items)){bad('このアプリで書き出したファイルではありません。');return}
    let skipped=0;const items=[],trash=[];
    d.items.forEach(o=>{const c=cleanItem(o);c?items.push(c):skipped++});
    (Array.isArray(d.trash)?d.trash:[]).forEach(o=>{const c=cleanItem(o);if(c){c.deletedAt=typeof o.deletedAt==='string'?o.deletedAt:new Date().toISOString();trash.push(c)}});
    parsed={items,trash};
    out.innerHTML=`<div class="cnt">植物 ${items.length}件 ・ ゴミ箱 ${trash.length}件${skipped?` ・ 読み込めなかった ${skipped}件`:''}</div>
      <label class="chk" style="margin:.5rem 0"><input type="radio" name="imm" value="merge" checked>いまのデータに追加する</label>
      <label class="chk" style="margin:.5rem 0"><input type="radio" name="imm" value="replace">いまのデータを置き換える</label>
      <div class="btns"><span class="sp"></span><button class="primary" id="imgo" type="button">読み込む</button></div>`;
    $('#imgo',w).onclick=async()=>{
      const mode=$('input[name=imm]:checked',w).value;
      if(mode==='replace'&&!await askConfirm('いまのデータを消して、ファイルの内容に置き換えます。よろしいですか?','置き換える'))return;
      if(mode==='replace'){S.items=parsed.items;S.trash=parsed.trash;S.hidden=[];S.hiddenItems=[];S.hiddenRanges=[]}
      else{
        const ids=new Set([...S.items,...S.trash].map(i=>i.id));
        parsed.items.forEach(i=>{if(ids.has(i.id))i.id=uid();ids.add(i.id);S.items.push(i)});
        parsed.trash.forEach(i=>{if(ids.has(i.id))i.id=uid();ids.add(i.id);S.trash.push(i)});
      }
      itemGroup.clearLayers();layers.clear();S.items.forEach(drawItem);applyFilter();updateFilterBadge();save();
      const n=parsed.items.length,m=parsed.trash.length;
      closeAllPops();

const PIN_PATH='M16 1C8 1 2 7 2 15c0 10 14 26 14 26s14-16 14-26C30 7 24 1 16 1z';
async function renderMap({range,width,items,names,rings,dark}){
  const b=range==='view'?map.getBounds():L.latLngBounds(ringPts(+range));
  const south=b.getSouth(),north=b.getNorth(),west=b.getWest(),east=b.getEast();
  let z=Math.floor(Math.log2(width*360/(256*(east-west))));z=Math.max(10,Math.min(18,z));
  const ws=256*Math.pow(2,z);
  const X=lng=>(lng+180)/360*ws;
  const Y=lat=>{const r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*ws};
  const x0=X(west),x1=X(east),y0=Y(north),y1=Y(south);
  const W=Math.round(x1-x0),H=Math.round(y1-y0),f=Math.max(1,W/1200);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  const P=(lat,lng)=>[X(lng)-x0,Y(lat)-y0];
  g.fillStyle='#dfe8d2';g.fillRect(0,0,W,H);
  // 地図タイル
  const sat=S.settings.mapType==='sat';
  const path=sat?'seamlessphoto/{z}/{x}/{y}.jpg':'std/{z}/{x}/{y}.png';
  const jobs=[];
  for(let tx=Math.floor(x0/256);tx<=Math.floor((x1-1)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y1-1)/256);ty++){
    jobs.push(new Promise(res=>{
      const im=new Image();im.crossOrigin='anonymous';
      im.onload=()=>{g.drawImage(im,tx*256-x0,ty*256-y0);res(true)};
      im.onerror=()=>res(false);
      im.src=GSI+path.replace('{z}',z).replace('{x}',tx).replace('{y}',ty);
    }));
  }
  if(!(await Promise.all(jobs)).some(Boolean))throw new Error('tiles');
  const trace=pts=>pts.forEach((p,i)=>{const[x,y]=P(p[0],p[1]);i?g.lineTo(x,y):g.moveTo(x,y)});
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const halo=(t,x,y,size,color)=>{g.font=`700 ${size}px "Hiragino Sans","Noto Sans JP",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=size/3;g.strokeStyle='#fff';g.strokeText(t,x,y);g.fillStyle=color;g.fillText(t,x,y)};
  // 3km外を暗く
  if(dark){g.beginPath();g.rect(0,0,W,H);trace(ringPts(R));g.closePath();g.fillStyle='rgba(0,0,0,.5)';g.fill('evenodd')}
  // 距離の円
  if(rings){
    const col=sat?'#FFE680':'#2F5D3A';
    RINGS.forEach(r=>{g.beginPath();trace(ringPts(r));g.closePath();g.setLineDash([12*f,14*f]);g.lineWidth=2.5*f;g.strokeStyle=col;g.stroke()});
    g.setLineDash([]);
    RINGS.forEach(r=>{
      const[x,y]=P(CENTER[0]+r/111320,CENTER[1]),t=r>=1000?r/1000+'km':r+'m',size=13*f;
      g.font=`700 ${size}px "Hiragino Sans",sans-serif`;
      const tw=g.measureText(t).width+14*f,th=size+8*f;
      rr(x-tw/2,y-th/2,tw,th,th/2);g.fillStyle='#fff';g.fill();g.lineWidth=1.5*f;g.strokeStyle='#2F5D3A';g.stroke();
      g.fillStyle='#1F4129';g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y+f*.5);
    });
    const[sx,sy]=P(CENTER[0],CENTER[1]);
    g.beginPath();g.arc(sx,sy,13*f,0,Math.PI*2);g.fillStyle='#2F5D3A';g.fill();g.lineWidth=3*f;g.strokeStyle='#fff';g.stroke();
    halo('校',sx,sy,13*f,'#fff');g.fillStyle='#fff';g.fillText('校',sx,sy);
  }
  // ピンと線
  if(items){
    const k=(S.settings.pinSize||100)/100,lw=S.settings.lineWidth||6,vis=S.items.filter(isShown);
    vis.filter(i=>i.type==='line').forEach(i=>{
      g.lineCap='round';g.lineJoin='round';
      g.beginPath();trace(i.pts);g.lineWidth=(lw+4)*f;g.strokeStyle='rgba(255,255,255,.9)';g.stroke();
      g.beginPath();trace(i.pts);g.lineWidth=lw*f;g.strokeStyle=safeColor(i.color);g.stroke();
      if(names){const m=i.pts[Math.floor(i.pts.length/2)],[x,y]=P(m[0],m[1]);halo(i.name,x,y-14*f,14*f,'#1D2A21')}
    });
    const pin=new Path2D(PIN_PATH);
    vis.filter(i=>i.type==='point').forEach(i=>{
      const[x,y]=P(i.pts[0][0],i.pts[0][1]),s=k*f;
      g.save();g.translate(x-16*s,y-41*s);g.scale(s,s);
      g.fillStyle=safeColor(i.color);g.fill(pin);g.lineWidth=2.5;g.strokeStyle='#fff';g.stroke(pin);
      g.beginPath();g.arc(16,15,5.5,0,Math.PI*2);g.fillStyle='#fff';g.fill();g.restore();
      if(names)halo(i.name,x,y-42*s-8*f,14*f,'#1D2A21');
    });
  }
  // 出典
  g.textAlign='right';g.font=`${11*f}px "Hiragino Sans",sans-serif`;g.textBaseline='bottom';g.lineJoin='round';
  g.lineWidth=3*f;g.strokeStyle='#fff';g.strokeText('出典: 国土地理院',W-8*f,H-6*f);g.fillStyle='#333';g.fillText('出典: 国土地理院',W-8*f,H-6*f);
  return cv;
}
function openShot(){
  let curUrl=null;
  const w=el(`<label class="f">保存する範囲<select id="sr"><option value="view">いま見ている範囲</option><option value="3000">3km圏ぜんぶ</option><option value="2000">2km圏</option><option value="1000">1km圏</option><option value="500">500m圏</option></select></label>
    <label class="f">画像の大きさ<select id="sz"><option value="1200">小(軽い)</option><option value="2000" selected>標準</option><option value="3200">大(きれい)</option></select></label>
    <div class="f">含めるもの
      <label class="chk" style="margin-top:.5rem"><input type="checkbox" id="s-items" checked>ピンと線</label>
      <label class="chk" style="margin-top:.5rem"><input type="checkbox" id="s-names" checked>植物名</label>
      <label class="chk" style="margin-top:.5rem"><input type="checkbox" id="s-rings" checked>距離の円とラベル</label>
      <label class="chk" style="margin-top:.5rem"><input type="checkbox" id="s-dark" checked>3km外を暗くする</label>
    </div>
    <div class="btns"><span class="sp"></span><button class="primary" id="s-go" type="button">画像を作る</button></div>
    <div id="s-out" hidden></div>`);
  $('#s-go',w).onclick=async()=>{
    const btn=$('#s-go',w),out=$('#s-out',w);
    btn.disabled=true;btn.textContent='作成中…';
    try{
      const cv=await renderMap({range:$('#sr',w).value,width:+$('#sz',w).value,items:$('#s-items',w).checked,names:$('#s-names',w).checked,rings:$('#s-rings',w).checked,dark:$('#s-dark',w).checked});
      const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.92));
      if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(blob);
      out.hidden=false;
      out.innerHTML=`<img alt="作成した地図の画像" style="width:100%;border-radius:.8rem;display:block;margin:.9rem 0 .4rem"><div class="cnt">${cv.width}×${cv.height}px ・ 画像を長押しして写真に追加もできます</div><button class="primary" id="s-save" type="button" style="width:100%">画像を保存する</button>`;
      $('img',out).src=curUrl;
      $('#s-save',out).onclick=async()=>{
        const name=`mitsugen-map-${today()}.jpg`,file=new File([blob],name,{type:'image/jpeg'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}
        }
        download(blob,name);info('画像を保存しました');
      };
    }catch(e){
      flash(e&&e.message==='tiles'?'地図画像を取得できませんでした。通信を確認してください':'画像を作れませんでした(地図データの取得制限の可能性があります)');
    }finally{btn.disabled=false;btn.textContent='画像を作る'}
  };
  openPop({title:'地図を画像で保存',body:w,onClose:()=>{if(curUrl)URL.revokeObjectURL(curUrl)}});
}

const pl=(n,w)=>`${n} ${w}${n==1?'':'s'}`;
const RULES=[
  [/^(\d+)件$/,m=>pl(m[1],'item')],
  [/^(\d+)種類$/,m=>pl(m[1],'kind')],
  [/^約(\d+)m$/,m=>`~${m[1]} m`],
  [/^画像(\d+)$/,m=>pl(m[1],'photo')],
  [/^開花(\d+)月$/,m=>`Blooms ${mon(m[1])}`],
  [/^開花(\d+)〜(\d+)月$/,m=>`Blooms ${mon(m[1])}–${mon(m[2])}`],
  [/^(\d+)月$/,m=>mon(m[1])],
  [/^(\d+)期間$/,m=>pl(m[1],'period')],
  [/^開花 (\d+)期間$/,m=>`Bloom: ${pl(m[1],'period')}`],
  [/^範囲 (\d+)$/,m=>`Range ${m[1]}`],
  [/^非表示 (\d+)$/,m=>`Hidden ${m[1]}`],
  [/^非表示の設定 (\d+)$/,m=>`Hidden settings: ${m[1]}`],
  [/^(\d+)件非表示$/,m=>`${m[1]} hidden`],
  [/^あと(\d+)日$/,m=>`${pl(m[1],'day')} left`],
  [/^削除 (.+)$/,m=>`Deleted ${m[1]}`],
  [/^今月\((\d+)月\)だけ$/,m=>`This month only (${mon(m[1])})`],
  [/^画像を追加\((\d+)枚まで\)$/,m=>`Add photos (up to ${m[1]})`],
  [/^画像は(\d+)枚までです$/,m=>`Up to ${m[1]} photos`],
  [/^曲がる点は(\d+)個までです$/,m=>`Up to ${m[1]} bend points`],
  [/^(点|直線|曲線)を登録$/,m=>`Add ${KEN[m[1]]}`],
  [/^「(.*)」をゴミ箱に移動しますか\?$/,m=>`Move "${m[1]}" to the trash?`],
  [/^「(.*)」をゴミ箱に移動しました$/,m=>`Moved "${m[1]}" to the trash`],
  [/^(点|直線|曲線)をゴミ箱に移動しました。$/,m=>`Moved the ${KEN[m[1]]} to the trash.`],
  [/^「(.*)」を追加しました$/,m=>`Added "${m[1]}"`],
  [/^(点|直線|曲線)として登録しました。$/,m=>`Registered as a ${KEN[m[1]]}.`],
  [/^学校から約(\d+)mの位置です。$/,m=>`About ${m[1]} m from the school.`],
  [/^メモ: (.*)$/,m=>`Notes: ${m[1]}`],
  [/^「(.*)」を編集しました$/,m=>`Edited "${m[1]}"`],
  [/^(点|直線|曲線)の内容を更新しました。$/,m=>`Updated the ${KEN[m[1]]}.`],
  [/^「(.*)」を復元しました$/,m=>`Restored "${m[1]}"`],
  [/^「(.*)」を完全に削除します。元に戻せません。$/,m=>`Permanently delete "${m[1]}"? This cannot be undone.`],
  [/^(追加|編集|削除|アップデート)のお知らせ$/,m=>`${NEN[m[1]]} notice`],
  [/^アップデート (v[\d.]+)$/,m=>`Update ${m[1]}`],
  [/^表示中の(\d+)件をゴミ箱に移動しますか\?$/,m=>`Move the ${pl(m[1],'notice')} shown to the trash?`],
  [/^植物 (\d+)件$/,m=>`Plants: ${m[1]}`],
  [/^ゴミ箱 (\d+)件$/,m=>`Trash: ${m[1]}`],
  [/^読み込めなかった (\d+)件$/,m=>`Skipped: ${m[1]}`],
  [/^登録した植物\((\d+)件\)とゴミ箱\((\d+)件\)を、1つのファイルに書き出します。画像も入ります。バックアップや、別の端末への引っ越しに使えます。$/,m=>`Exports your ${pl(m[1],'plant')} and ${pl(m[2],'trashed item')} to one file, including photos. Use it as a backup or to move to another device.`],
  [/^植物(\d+)件、ゴミ箱(\d+)件を読み込みました。\((追加|置き換え)\)$/,m=>`Imported ${pl(m[1],'plant')} and ${pl(m[2],'trashed item')}. (${m[3]==='追加'?'added':'replaced'})`]
];
let lang=S.settings.lang==='en'?'en':'ja';
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function trSeg(t){
  const pm=t.match(/^((?:[\p{Extended_Pictographic}\u200d\ufe0f]+\s*)+)([\s\S]+)$/u);
  if(pm)return pm[1]+trSeg(pm[2]);
  if(has(EN,t))return EN[t];
  for(const[re,f]of RULES){const m=t.match(re);if(m)return f(m)}
  return t;
}
function trLine(line){
  const core=line.trim();if(!core)return line;
  const lead=line.slice(0,line.indexOf(core)),trail=line.slice(line.indexOf(core)+core.length);
  if(has(EN,core))return lead+EN[core]+trail;
  return lead+core.split(' ・ ').map(trSeg).join(' · ')+trail;
}
const trText=str=>str.split('\n').map(trLine).join('\n');
const trRec=new WeakMap(),trAttr=new WeakMap();
function trNode(n){
  if(n.nodeType===3){
    const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;
    let rec=trRec.get(n);
    if(!(rec&&n.nodeValue===rec.out))rec={src:n.nodeValue,out:n.nodeValue};
    const out=lang==='en'?trText(rec.src):rec.src;
    rec.out=out;trRec.set(n,rec);
    if(n.nodeValue!==out)n.nodeValue=out;
  }else if(n.nodeType===1){
    if(/^(SCRIPT|STYLE)$/.test(n.nodeName))return;
    let rec=trAttr.get(n);if(!rec){rec={};trAttr.set(n,rec)}
    for(const a of['placeholder','aria-label']){
      if(!n.hasAttribute(a))continue;
      const cur=n.getAttribute(a),r=rec[a];
      const src=(r&&cur===r.out)?r.src:cur;
      const out=lang==='en'?trText(src):src;
      rec[a]={src,out};
      if(cur!==out)n.setAttribute(a,out);
    }
  }
}
function trAll(root=document.body){
  const wk=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let n=wk.currentNode;
  do{trNode(n)}while((n=wk.nextNode()));
}
function trSub(node){
  if(node.nodeType===3||node.nodeType===1){trNode(node);if(node.nodeType===1)trAll(node)}
}
function initLang(){
  document.documentElement.lang=lang;
  document.title=lang==='en'?'Honey Source Map':'みつばち蜜源マップ';
  new MutationObserver(recs=>{
    if(lang!=='en')return;
    for(const r of recs){
      if(r.type==='childList')r.addedNodes.forEach(trSub);
      else trNode(r.target);
    }
  }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label']});
  if(lang==='en')trAll();
}
function setLang(l){
  lang=l==='en'?'en':'ja';S.settings.lang=lang;save();
  document.documentElement.lang=lang;
  document.title=lang==='en'?'Honey Source Map':'みつばち蜜源マップ';
  if(auth)auth.languageCode=lang;
  trAll();updateAccountBtn();
}

if(S.bloomMonth){S.bloomRanges=[{from:S.bloomMonth,to:S.bloomMonth}];S.bloomMonth=0}
{const lim=Date.now()-30*864e5,n=S.trash.length;S.trash=S.trash.filter(t=>!t.deletedAt||new Date(t.deletedAt).getTime()>lim);S.noticeTrash=(S.noticeTrash||[]).filter(t=>!t.deletedAt||new Date(t.deletedAt).getTime()>lim);if(S.trash.length!==n)save()}
S.items.forEach(drawItem);applyFilter();
const firstRun=!S.seeded;
if(!S.seeded){S.seeded=true;addNotice('upd','みつばち蜜源マップへようこそ','多治見西高校から3km圏内の蜜源植物を、点と線で登録できます。\n\n「編集」に切り替えて地図をタップすると登録できます。使い方はメニューの「使い方」から見られます。',null,true)}

  {id:'v1.3',title:'アップデート v1.3',body:'・曲線の曲がる点を増やせるようになりました(線をタップ、または「曲がる点を追加」)\n・黄色の点を選んで削除もできます\n・編集中の点から文字を外し、色(緑=始点、赤=終点、黄=曲がる点)で見分けるようにしました'},
  {id:'v1.4',title:'アップデート v1.4',body:'・地図の左上に「フィルター」を追加しました。植物の名前ごとに、表示するピンや線を選べます\n・現在地ボタンを追加しました。押すと現在地が地図に出ます(位置情報の許可が必要です)\n・編集モードの「点」で「現在地に登録」を押すと、いまいる場所にピンを追加できます\n・設定に「現在地を表示」のオン/オフを追加しました'},
  {id:'v1.5',title:'アップデート v1.5',body:'・「表示する植物」に検索・種類・状態の絞り込みと、並び替え(名前順・件数順・新しい順)を追加しました\n・「一覧をすべて表示/非表示」は、絞り込んだ植物だけに働きます\n・トーストは同時に5つまで表示するようにしました'},
  {id:'v1.6',title:'アップデート v1.6',body:'・「植物一覧」と「表示する植物」の画面をコンパクトにしました\n・検索・絞り込み・並び替えを1〜2行にまとめ、一度に見られる植物が増えました'},
  {id:'v1.7',title:'アップデート v1.7',body:'・「植物一覧」と「表示する植物」の画面を大きくしました\n・「表示する植物」の並び替えを、種類・状態と同じ行に移しました\n・地図をさらに拡大できるようになりました(拡大しすぎると画質は粗くなります)'},
  {id:'v1.8',title:'アップデート v1.8',body:'・「植物一覧」と「表示する植物」の画面を縦にも大きくしました'},
  {id:'v1.9',title:'アップデート v1.9',body:'・「表示する植物」をアコーディオンにしました。植物名をタップすると、その植物の点・線が一件ずつ開きます\n・一件ごとに表示/非表示を切り替えられます。「見る」で地図の場所へ移動します\n・「範囲ごとに切り替え」で、学校から500m・1km・2km・3kmの区間ごとに表示/非表示を切り替えられます\n・新しく登録したり編集したピンは、自動で表示に戻ります'},
  {id:'v1.10',title:'アップデート v1.10',body:'・「表示する植物」の「絞り込み・並び替え・一括操作」(種類・状態・並び替え・一覧をすべて表示/非表示)を折りたためるようにしました\n・折りたたんだままでも、いま選んでいる条件が横に表示されます'},
  {id:'v1.11',title:'アップデート v1.11',body:'・設定に「ピンのサイズ」(50〜200%)と「線の太さ」(2〜14px)のスライダーを追加しました\n・動かすと、地図のピンと線の大きさがその場で変わります'},
  {id:'v1.12',title:'アップデート v1.12',body:'・植物一覧に「ゴミ箱」を追加しました。削除した植物は30日間残り、復元できます\n・登録するときに「開花時期」(開始月〜終了月)を入れられるようになりました\n・「表示する植物」と「植物一覧」に、開花月での絞り込みを追加しました\n・メニューに「データの書き出し」「データの読み込み」を追加しました\n・メニューに「地図を画像で保存」を追加しました。保存する範囲(いま見ている範囲/3km・2km・1km・500m圏)を選べます'},
  {id:'v1.13',title:'アップデート v1.13',body:'・削除できない不具合を直しました。確認画面をアプリ内の表示に変えたため、プレビューでも削除・復元・読み込みの確認が動きます'},
  {id:'v1.14',title:'アップデート v1.14',body:'・トーストの表示を、同時に3つまでにしました(4つ目が出るときは、いちばん古いものから消えます)'},
  {id:'v1.15',title:'アップデート v1.15',body:'・開花時期の絞り込みで、複数の期間を指定できるようになりました(例: 3〜4月と9〜10月)\n・「絞り込み・並び替え・一括操作」「範囲ごとに切り替え」「開花時期で絞り込み」を、1つの折りたたみにまとめました'},
  {id:'v1.16',title:'アップデート v1.16',body:'・「植物一覧」の絞り込みを、「表示する植物」と同じ構成にしました\n・「絞り込み・並び替え・範囲・開花時期」を1つの折りたたみにまとめ、範囲ごと・開花時期(複数期間)でも一覧を絞り込めます\n・「状態」で、地図に表示中/非表示のものだけを一覧にできます'},

  {id:'v1.18',title:'アップデート v1.18',body:'・ゴミ箱まわり(「一覧 / ゴミ箱」の切り替え、「復元」「消す」「ゴミ箱を空にする」)の文字が途中で折り返して崩れないように直しました'},

  {id:'v1.20',title:'アップデート v1.20',body:'・地図で近くにある同じ名前のピンを、数字つきの1つのピンにまとめて表示するようにしました(タップで拡大、設定でオン/オフ)\n・ヘッダーの右上にアカウントマークを追加しました\n・アカウントの作成・設定、共有マップの画面を追加しました(共有機能は準備中で、まだ使えません)'},
  {id:'v1.21',title:'アップデート v1.21',body:'・アカウントを使えるようにしました。Googleまたはメールアドレスで、アカウントの作成とログインができます(共同作成はまだ使えません)\n・お知らせを削除できるようにしました。削除したお知らせは「ゴミ箱」から30日間復元できます\n・設定に「言語」を追加しました(日本語 / English)\n・ゴミ箱まわりのボタンを小さめにしました'},
  {id:'v1.22',title:'アップデート v1.22',body:'・画面上部に「メンテナンス中」の表示を出すようにしました。機能は使えますが、エラーやバグが起きることがあります'}
];
