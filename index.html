<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPad画面共有</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: #1f6feb;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  background: #1f6feb;
  color: white;
  cursor: pointer;
}

button.stop {
  background: #d73a49;
}

button:disabled {
  opacity: .5;
}

.status {
  margin: 15px 0;
  padding: 12px;
  border-radius: 10px;
  background: #eef3f8;
  text-align: center;
}

video {
  width: 100%;
  margin-top: 15px;
  border-radius: 15px;
  background: #000;
  display: none;
}

.info {
  margin-top: 20px;
  padding: 15px;
  background: #fff8db;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>📱 iPad画面共有</h1>
</header>

<main>

  <div class="card">

    <div class="status" id="status">
      画面共有の準備ができています
    </div>

    <button id="startButton">
      ▶ 画面共有を開始
    </button>

    <button id="stopButton" class="stop" style="display:none;">
      ■ 画面共有を停止
    </button>

    <video id="preview" autoplay playsinline muted></video>

    <div class="info">
      <strong>使い方</strong><br>
      ①「画面共有を開始」を押す<br>
      ② Safariに表示される画面共有の確認を行う<br>
      ③ 共有したい画面を選択する<br>
      ④ このページに共有画面が表示されます
    </div>

  </div>

</main>

<script>

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

let stream = null;

startButton.addEventListener("click", async () => {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia) {

    status.textContent =
      "このブラウザでは画面共有に対応していません。";

    return;
  }

  try {

    status.textContent =
      "共有する画面を選択してください…";

    stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true
    });

    preview.srcObject = stream;
    preview.style.display = "block";

    startButton.style.display = "none";
    stopButton.style.display = "block";

    status.textContent =
      "🟢 画面共有中";

    const videoTrack =
      stream.getVideoTracks()[0];

    videoTrack.addEventListener("ended", () => {
      stopSharing();
    });

  } catch (error) {

    console.error(error);

    status.textContent =
      "画面共有がキャンセルされました。";

  }

});


stopButton.addEventListener("click", () => {
  stopSharing();
});


function stopSharing() {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  preview.srcObject = null;
  preview.style.display = "none";

  startButton.style.display = "block";
  stopButton.style.display = "none";

  status.textContent =
    "画面共有を停止しました。";
}

</script>

</body>
</html>
